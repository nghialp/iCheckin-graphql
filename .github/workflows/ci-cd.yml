name: CI / CD Deploy

on:
  push:
    branches: [ main ]

jobs:
  test-and-deploy:
    name: Test and deploy
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max_old_space_size=4096"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image (for tests)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: |
            checkin-backend-test:${{ github.sha }}

      # Tests are run during the Docker build (see Dockerfile test stage).

      - name: Deploy to server (SSH clone + docker-compose)
        if: success()
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          script: |
            set -euo pipefail
            REPO="${{ github.repository }}"
            BRANCH="${{ github.ref_name || 'main' }}"
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            GIT_CLONE_TOKEN="${{ secrets.DEPLOY_TOKEN || '' }}"
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"
            if [ -d .git ]; then
              echo "Repository exists, fetching latest"
              git fetch --all
              git reset --hard origin/$BRANCH
              git checkout $BRANCH || git checkout -b $BRANCH origin/$BRANCH
            else
              echo "Cloning repository"
              if [ -n "$GIT_CLONE_TOKEN" ]; then
                git clone --single-branch --branch "$BRANCH" "https://x-access-token:${GIT_CLONE_TOKEN}@github.com/${REPO}.git" .
              else
                git clone --single-branch --branch "$BRANCH" "https://github.com/${REPO}.git" .
              fi
            fi
            # Ensure docker compose is available and start the services
            docker compose -f docker-compose.yml pull --ignore-pull-failures || true
            docker compose -f docker-compose.yml up -d --build --remove-orphans
