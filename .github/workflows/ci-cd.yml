name: CI / CD Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max_old_space_size=4096"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install pnpm
        run: npm install -g pnpm@8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test --reporter=mocha-junit-reporter || true

      - name: Build
        run: pnpm build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

      - name: Remote deploy container (SSH)
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          script: |
            set -euo pipefail
            IMAGE=ghcr.io/${{ github.repository }}:${{ github.sha }}
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            COMPOSE_FILE="$DEPLOY_PATH/docker-compose.prod.yml"
            HOST_PORT=${{ secrets.DEPLOY_APP_PORT || '3000' }}
            mkdir -p "$DEPLOY_PATH"
            # If registry credentials provided, login first so server can pull private images
            if [ -n "${{ secrets.GHCR_USERNAME || '' }}" ] && [ -n "${{ secrets.GHCR_PASSWORD || '' }}" ]; then
              echo "Logging in to ghcr.io"
              echo "${{ secrets.GHCR_PASSWORD }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            fi
            # write docker-compose file that references the newly built image
            cat > "$COMPOSE_FILE" <<EOF
            version: '3.8'
            services:
              icheckin-api:
                image: ${IMAGE}
                restart: unless-stopped
                ports:
                  - "${HOST_PORT}:3000"
                env_file:
                  - ${DEPLOY_PATH}/.env
            EOF

            # pull image and start via docker compose
            docker compose -f "$COMPOSE_FILE" pull --ignore-pull-failures || true
            docker compose -f "$COMPOSE_FILE" up -d --remove-orphans
