name: CI / CD Deploy

on:
  push:
    branches: [ main ]

jobs:
  test-and-deploy:
    name: Test and deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Debug secrets
        run: |
          echo "DEPLOY_HOST = ${{ secrets.DEPLOY_HOST }}"
          echo "DEPLOY_USER = ${{ secrets.DEPLOY_USER }}"
          echo "DEPLOY_PORT = ${{ secrets.DEPLOY_PORT }}"
          echo "DEPLOY_PATH = ${{ secrets.DEPLOY_PATH }}"
          if [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "❌ DEPLOY_SSH_KEY is NOT set!"
            exit 1
          else
            echo "✅ DEPLOY_SSH_KEY is set (masked)."
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Validate deploy credentials
        run: |
          if [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "ERROR: Missing deploy credentials. Set DEPLOY_SSH_KEY in repository Secrets."
            exit 1
          fi

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Check for migration changes
        id: migration-changed
        uses: trilom/file-changes-action@v1.2.4
        with:
          output: 'json'
          fileOutput: 'json'

      - name: Install dependencies
        run: |
          npm install -g pnpm
          pnpm install

      - name: Build project
        run: pnpm build

      - name: Run database migrations on server (if migration files changed)
        if: steps.migration-changed.outputs.files_changed != ''
        run: |
          echo "🔄 Migration files detected, running migrations on server..."
          ssh -i ~/.ssh/id_rsa -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            
            cd "$DEPLOY_PATH"
            
            # Install dependencies if not exists
            if [ ! -d "node_modules" ]; then
              npm install -g pnpm
              pnpm install --prod
            fi
            
            # Install TypeScript and required dependencies for migration
            pnpm install typescript ts-node -g
            
            # Run migrations
            echo "🚀 Running database migrations..."
            pnpm migration:run || {
              echo "❌ Migration failed!"
              exit 1
            }
            echo "✅ Migrations completed successfully!"
          EOF

      - name: Deploy to server
        run: |
          ssh -i ~/.ssh/id_rsa -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            set -euo pipefail
            REPO="${{ github.repository }}"
            BRANCH="${{ github.ref_name }}"
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            GIT_CLONE_TOKEN="${{ secrets.DEPLOY_TOKEN }}"

            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            if [ -d .git ]; then
              echo "Repository exists, fetching latest"
              git fetch --all
              git reset --hard origin/$BRANCH
              git checkout $BRANCH || git checkout -b $BRANCH origin/$BRANCH
            else
              echo "Cloning repository"
              if [ -n "$GIT_CLONE_TOKEN" ]; then
                git clone --single-branch --branch "$BRANCH" "https://x-access-token:${GIT_CLONE_TOKEN}@github.com/${REPO}.git" .
              else
                git clone --single-branch --branch "$BRANCH" "https://github.com/${REPO}.git" .
              fi
            fi

            docker compose -f docker-compose.yml pull --ignore-pull-failures || true
            docker compose -f docker-compose.yml up -d --build --remove-orphans
          EOF