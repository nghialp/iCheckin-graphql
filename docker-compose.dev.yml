version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: icheckin-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_HOST}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - "${DB_DATABASE:-5432}:5432"
    volumes:
      - icheckin_data:/var/lib/postgresql/data
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: icheckin-api-dev
    restart: always
    env_file:
      - .env
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - postgres
volumes:
  icheckin_data: